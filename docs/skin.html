"}, {"nct": "NCT06947928", "title": "Placebo-Controlled Trial of IFx-Hu2.0 Followed By Pembrolizumab In Checkpoint Inhibitor Naïve Participants With Advanced Or Metastatic Merkel Cell Carcinoma", "phase": "Phase 3", "phase_full": "PHASE2;PHASE3", "status": "RECRUITING", "cluster": 1, "x": -1473.9225852126674, "y": 1120.8845458817361, "regimen": "IO", "add": "—", "B": "pembrolizumab", "A": "ifx-hu2.0;pembrolizumab", "targets": "PD-1", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "—", "sponsor": "TuHURA Biosciences, Inc.", "scale": 5, "enroll": 118, "big": 0, "start": "2025-12-11", "pcd": "2027-03-31", "summary": "This Phase 2/3, multicenter, randomized, double-blind, placebo-controlled trial will evaluate the Objective Response Rate (ORR) of IFx-Hu2.0 as an adjunctive therapy to pembrolizumab in adult participants (≥18 years) with advanced or metastatic Merkel Cell Carcinoma. A total of 118 participants will be randomized to receive either IFx-Hu2.0 or placebo via intralesional injection in a single lesion, followed by pembrolizumab.", "eligibility": "Inclusion Criteria:  1. At least 18 years of age. 2. Life expectancy equal to or greater than six months. 3. Eastern Cooperative Oncology Group (ECOG) Performance Status \\< 2. 4. Must be recurrent and/or unresectable Stage III or Stage IV American Joint Committee on Cancer (AJCC) (8th edition) and have histologically confirmed Merkel cell carcinoma     1. Must have at least one injectable lesion equal to or greater than 3 mm.    2. Must have measurable disease as defined by RECIST v1.1. 5. Participants should be CPI naïve i.e., no prior therapy with CPI including but not limited to Pembrolizumab, avelumab, ipilimumab, nivolumab. 6. Tumor tissue from an archival core biopsy or resected site o"}, {"nct": "NCT07302347", "title": "A Study of Pembrolizumab in Japanese Pediatric Participants With Solid Tumors or Lymphomas and Japanese Adult Participants With Merkel Cell Carcinoma (MK-3475-G21/KEYNOTE-G21)", "phase": 03", "pcd": "2026-05-27", "summary": "This clinical trial will assess the safety and tolerability of topical application of RLS-1496 cream to lesions and adjacent skin on the left forearm of adults with actinic keratoses (AK) on the arms. The right forearm will remain untreated as a control. The therapeutic objective of topical treatment with RLS-1496 cream is to clear or decrease the number of AK in the treated area, per lesion counts performed by the Investigator.  The main questions it aims to answer are:  * Is it safe to apply topical RLS-1496 cream to treat AK once daily for 28 days? * Does topical RLS-1496 lower the number o", "eligibility": "Key Inclusion Criteria:  * area on each dorsal forearm with 4-12 clinically typical, discrete and visibly evident AK lesions within a 25-100 cm2 area * willing to comply with the study requirements, including refraining from use of medications or other treatments for the skin disease (including sun and ultraviolet light exposure), and is able to reliably apply topical medications  Key Exclusion Criteria:  * significant skin disease other than AK which may interfere with interpretation of clinical findings * atypical or rapidly changing AK lesions at the intended treatment and control area (including cutaneous horn, hyperkeratotic, hypertrophic lesions) * clinically relevant co-morbid medical"}, {"nct": "NCT07808515", "title": "A Study Comparing Cemiplimab-based Treatments for Adult Participants With Locally Advanced Basal Cell Skin Cancer (laBCC)", "phase": "Phase 2", "phase_full": "PHASE2", "status": "NOT_YET_RECRUITING", "cluster": 0, "x": -237.20071814875126, "y": -2145.7410919622184, "regimen": "IO", "add": "—", "B": "cemiplimab", "A": "cemiplimab;fianlimab;vidutolimod", "targets": "PD-1", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "—", "sponsor": "Regeneron Pharmaceuticals", "scale": 95, "enroll": 135, "big": 1, "start": "2026-10-15", "pcd": "2030-11-13", "summary": "This study will test an experimental Regeneron drug called cemiplimab (\"study drug\") given alone or in combination with other anti-cancer drugs (\"combination treatment\") to see if they can help treat laBCC.  The study is looking at:  * What side effects cemiplimab, alone or in a combination treatment, might cause * How well cemiplimab, alone or in a combination treatment, works * How cemiplimab, alone or in a combination treatment could affect the immune system, which can help researchers understand why cemiplimab, alone or in a combination treatment, works better in some participants than oth", "eligibility": "Key Inclusion Criteria:  1. Histologic confirmation of BCC by local board-certified pathologist, as described in the protocol 2. At least one lesion that is measurable by study criteria, defined as ≥ 1cm in at least one dimension, as assessed by radiology and/or digital medical photography, as described in the protocol 3. The treating physician must document that the participant is not appropriate for curative-intent surgery or curative-intent radiation 4. The treating physician must document that the participant does not wish to receive a hedgehog pathway inhibitor (HHI) or is not a candidate for an HHI 5. Eastern Cooperative Oncology Group (ECOG) performance status ≤ 1  Subsequent Therapy "}], CLUSTERS=[{"id": 0, "n": 4, "color": "#1f77b4", "name": "cemiplimab, doxorubicin", "rep": "Replimune, Inc.", "B": "cemiplimab"}, {"id": 1, "n": 4, "color": "#d62728", "name": "pembrolizumab", "rep": "Medicenna Therapeutics, Inc.", "B": "pembrolizumab"}, {"id": 2, "n": 1, "color": "#e377c2", "name": "topotecan", "rep": "Fujifilm Pharmaceuticals U.S.A., Inc. (빅파마 없음·최근접)", "B": "topotecan"}, {"id": 3, "n": 1, "color": "#17becf", "name": "s-1", "rep": "Rubedo Life Sciences, Inc. (빅파마 없음·최근접)", "B": "s-1"}], COMPANIES=[{"name": "Fujifilm Pharmaceuticals U.S.A., Inc.", "scale": 7, "n": 1, "big": 0}, {"name": "Medicenna Therapeutics, Inc.", "scale": 2, "n": 1, "big": 1}, {"name": "Merck Sharp & Dohme LLC", "scale": 649, "n": 1, "big": 1}, {"name": "Regeneron Pharmaceuticals", "scale": 95, "n": 2, "big": 1}, {"name": "Replimune, Inc.", "scale": 10, "n": 1, "big": 1}, {"name": "Rubedo Life Sciences, Inc.", "scale": 1, "n": 1, "big": 0}, {"name": "SkinJect, Inc.", "scale": 3, "n": 1, "big": 0}, {"name": "TuHURA Biosciences, Inc.", "scale": 5, "n": 2, "big": 0}];
const HL=3, NPHASE=3, ALPHAS=[0.35, 0.65, 1.0];
const CC={}; CLUSTERS.forEach(c=>CC[c.id]=c.color);
const gd=document.getElementById('map');

// cluster overview
const cl=document.getElementById('clusters');
CLUSTERS.forEach(c=>{ const d=document.createElement('div'); d.className='clu';
  d.innerHTML=`<span class="dot" style="background:${c.color}"></span>
    <div><b>C${c.id}</b> · ${c.name} <span class="sub">(n=${c.n})</span>
    <div class="sub">대표: ${c.rep} · B: ${c.B}</div></div>`;
  cl.appendChild(d); });

// company dropdown (scale desc)
const sel=document.getElementById('company');
COMPANIES.forEach(c=>{ const o=document.createElement('option'); o.value=c.name;
  o.textContent=`${c.name} — R&D ${c.scale} · ${c.n} trial${c.n>1?'s':''}${c.big?'  ★':''}`;
  sel.appendChild(o); });

function fmtDate(s){ return s && s!=='nan' ? s : '—'; }
function card(t){ const url='https://clinicaltrials.gov/study/'+t.nct;
  const reg = t.regimen + (t.add && t.add!=='chemo only' ? ' + '+t.add : '');
  return `<div class="card" style="border-left-color:${CC[t.cluster]||'#ccc'}">
    <a href="${url}" target="_blank"><b>${t.nct}</b> ↗</a>${t.big?'<span class="big">★ big pharma</span>':''}
    <div class="title">${t.title}</div>
    <div class="row"><span class="chip ph">${t.phase}</span><span class="chip st">${t.status}</span>
      <span class="chip">C${t.cluster}</span>${t.tme?'<span class="chip tme">TME 관련</span>':''}
      <span class="chip">enroll ${t.enroll??'—'}</span></div>
    <div class="row"><b>표준치료 레지멘(B):</b> ${reg}　<span class="muted">[${t.B}]</span></div>
    <div class="row"><b>실험약(A):</b> ${t.A}</div>
    <div class="row"><b>타겟:</b> ${t.targets}　<b>모달리티:</b> ${t.modalities}</div>
    <div class="row"><b>바이오마커(eligibility):</b> ${t.bio}</div>
    <div class="row"><b>스폰서:</b> ${t.sponsor} <span class="muted">(R&D scale ${t.scale})</span></div>
    <div class="row muted">시작 ${fmtDate(t.start)} · 1차완료(예정) ${fmtDate(t.pcd)}</div>
    ${t.summary?`<details class="sum"><summary>연구 요약</summary><p>${t.summary}</p></details>`:''}
    ${t.eligibility?`<details class="sum"><summary>선정기준(발췌)</summary><p>${t.eligibility}</p></details>`:''}
  </div>`; }

function renderCards(ts, head){
  document.getElementById('cards').innerHTML =
    `<div class="cnt">${head}</div>` + (ts.length? ts.map(card).join('') : '<div class="muted">해당 임상 없음</div>');
}

function highlight(coords){
  // 빨간 링만 표시(나머지는 흐리게 하지 않음)
  Plotly.restyle('map', {x:[coords.map(c=>c[0])], y:[coords.map(c=>c[1])]}, [HL]);
}

function showCompany(name){
  if(name==='__ALL__'){ highlight([]); renderCards([], '전체 보기 — 제약사를 선택하세요'); return; }
  const ts=TRIALS.filter(t=>t.sponsor===name).sort((a,b)=>a.cluster-b.cluster);
  highlight(ts.map(t=>[t.x,t.y]));
  renderCards(ts, `${name} — ${ts.length} trial${ts.length>1?'s':''}`);
}
sel.addEventListener('change', e=>showCompany(e.target.value));
document.getElementById('reset').addEventListener('click', ()=>{ sel.value='__ALL__'; showCompany('__ALL__'); });

if(gd && gd.on){ gd.on('plotly_click', ev=>{
  const nct=ev.points[0].customdata? ev.points[0].customdata[0]: null; if(!nct) return;
  const t=TRIALS.find(x=>x.nct===nct); if(!t) return;
  sel.value=t.sponsor; highlight([[t.x,t.y]]);
  renderCards([t], `${t.nct} · ${t.sponsor}`);
  document.getElementById('cards').scrollTop=0;
});}
</script>
</body></html>
