h pembrolizumab alone with respect to progression-free survival (PFS) and overall survival (OS) per Response Evaluation Criteria in Solid Tumors Version 1.1 (RECIST 1.1) as assessed by blinded independent central review (BICR) among adults with metastatic non-small cell lung cancer (NSCLC) with programmed cell death ligand 1 (PD-L1) tumor proportion score (TPS) ≥50%).", "eligibility": "Inclusion Criteria:  The main inclusion criteria include but are not limited to the following:  * Has a histologically or cytologically confirmed diagnosis of metastatic non-small cell lung cancer (NSCLC) * Has confirmation that epidermal growth factor receptor (EGFR), anaplastic lymphoma kinase 1 (ALK-1), or ROS proto-oncogene 1 (ROS-1)-directed therapy is not indicated as primary therapy * Has provided tumor tissue that demonstrates PD-L1 tumor proportion score (TPS) ≥50% of tumor cells as assessed by immunohistochemistry (IHC) at a central laboratory * Has a life expectancy of at least 3 months  Exclusion Criteria:  The main exclusion criteria include but are not limited to the following:"}, {"nct": "NCT05633667", "title": "Study of Novel Treatment Combinations in Patients With Lung Cancer", "phase": "Phase 2", "phase_full": "PHASE2", "status": "ACTIVE_NOT_RECRUITING", "cluster": 0, "x": 72.21167806846712, "y": -25.39981083210975, "regimen": "platinum doublet", "add": "IO", "B": "carboplatin;cisplatin;docetaxel;nab-paclitaxel;nivolumab;paclitaxel;pemetrexed", "A": "carboplatin;domvanalimab (dom);etrumadenant (etruma);paclitaxel;pemetrexed;sacituzumab govitecan-hziy (sg);zimberelimab (zim)", "targets": "PD-1", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "ALK, PD-L1", "sponsor": "Gilead Sciences", "scale": 168, "enroll": 192, "big": 1, "start": "2023-03-16", "pcd": "2029-09", "summary": "The goal of this platform clinical trial is to test how well novel treatment combinations work in participants with lung cancer. Substudy-01 will compare the different novel combinations ve emale patients at least 18 years of age * Newly diagnosed Stage IIIB/C or IV non-small cell lung cancer (according to Revised Cancer Staging by American Joint Committee on Cancer (AJCC) and the International Union Against Cancer (UICC) 8th edition) or recurrent non-small cell lung cancer (NSCLC) * Histologically or cytologically confirmed diagnosis of predominately non-squamous NSCLC * Eastern Cooperative Oncology Group (ECOG) performance status 0 or 1 * Be eligible to receive study treatment of bevacizumab, paclitaxel, and carboplatin based on local standard of care, for the treatment of advanced or metastatic non-squamous NSCLC * "}, {"nct": "NCT05668988", "title": "A Study of DZD9008 Versus Platinum-Based Doublet Chemotherapy in Local Advanced or Metastatic Non-small Cell Lung Cancer (WU-KONG28)", "phase": "Phase 3", "phase_full": "PHASE3", "status": "ACTIVE_NOT_RECRUITING", "cluster": 0, "x": 62.74798254028966, "y": -156.7652361485165, "regimen": "platinum doublet", "add": "backbone only", "B": "carboplatin;pemetrexed", "A": "sunvozertinib", "targets": "EGFR", "modalities": "Small Molecule", "tme": 0, "bio": "EGFR_mut", "sponsor": "Dizal Pharmaceuticals", "scale": 29, "enroll": 324, "big": 0, "start": "2022-12-13", "pcd": "2026-01-16", "summary": "This is a phase 3, open-label, randomized, multi-center study assessing the efficacy and safety of DZD9008 versus platinum-based doublet chemotherapy in participants with locally advanced or metastatic NSCLC with EGFR Exon20ins mutation, who are newly diagnosed or have not received prior systemic therapy in advanced stage.  Primary objective of this study is to assess the efficacy of DZD9008 versus platinum-based doublet chemotherapy using by BICR-assessed PFS per RECIST 1.1 as primary endpoint. Approximately 320 participants are estimated to be randomized into the study. Participants enrolled", "eligibility": "Inclusion Criteria:  1. Aged at least 18 years old (or per local regulatory/IRB requirement). 2. Histologically or cytologically confirmed diagnosis of non-squamous NSCLC, locally advanced (Stage IIIB and IIIC according to the 8th edition of the AJCC TNM staging criteria) or metastatic (Stage IV), not suitable for curative therapy. 3. Adequate tumor tissue available, for central laboratory confirmation of EGFR exon 20 insertion mutation 4. At least 1 measurable lesion per RECIST Version 1.1 5. Life expectancy ≥ 12 weeks 6. Eastern Cooperative Oncology Group (ECOG) performance status of 0 to 1 7. Adequate organ and hematologic function  Exclusion Criteria:  1. Prior treatment with any systemi"}, {"nct": "NCT05671510", "title": "ONC-392 Versus Docetaxel in Metastatic NSCLC That Progressed on PD-1/PD-L1 Inhibitors", "phase": "Phase 3", "phase_full": "PHASE3", "status": "ACTIVE_NOT_RECRUITING", "cluster": 2, "x": -181.38259889710014, "y": 18.672592837327297, "regimen": "docetaxel", "add": "backbone only", "B": "docetaxel", "A": "gotistobart", "targets": "PD-1", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "ROS1, PD-L1", "sponsor": "OncoC4, Inc.", "scale": 10, "enroll": 630, "big": 0, "start": "2023-06-28", "pcd": "2027-08-31", "summary": "The goal of this Phase 3 clinical trial is to study the safety and efficacy of the nextgen anti-CTLA-4 antibody, gotistobart (ONC-392/BNT316), in patients with metastatic non-small cell lung cancer who have disease progressed on anti-PD-1/PD-L1 antibody based therapy. The study will test whether gotistobart, in comparison with chemotherapy agent docetaxel, could prolong the life for NSCLC patients. Patients will be randomized to be treated with either gotistobart or docetaxel, IV infusion, once every 21 days, for up to 17 cycles in approximately one year.", "eligibility": "Inclusion Criteria (Major criteria):  1. Adult (≥ 18 years), all genders, capable of signing informed consent. 2. Histologically- or cytologically- confirmed diagnosis of metastatic squamous NSCLC, metastasis can be regional lymph nodes or distant organs. 3. Radiographic progression after treatment with the most recent line of treatment being either 3a or 3b:     1. At least 12 weeks of PD-1/PD-L1 inhibitor in combination with platinum-based chemotherapy;    2. Prior treatment with at least 2 cycles of a platinum-based chemotherapy, followed by at least 12 weeks of standard doses of PD-1 or PD-L1 inhibitor-based immunotherapy.     Antibodies against CTLA-4, LAG-3, TIGIT, VEGF or VEGFR in com"}, {"nct": "NCT05687266", "title": "Phase III, Open-label, First-line Study of Dato-DXd in Combination With Durvalumab and Carboplatin for Advanced NSCLC Without Actionable Genomic Alterations", "phase": "Phase 3", "phase_full": "PHASE3", "status": "ACTIVE_NOT_RECRUITING", "cluster": 0, "x": 38.255634500630514, "y": -40.86389178326472, "regimen": "platinum doublet", "add": "IO", "B": "carboplatin;cisplatin;paclitaxel;pembrolizumab;pemetrexed", "A": "carboplatin;datopotamab deruxtecan;durvalumab", "targets": "PD-L1", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "ROS1", "sponsor": "AstraZeneca", "scale": 780, "enroll": 1350, "big": 1, "start": "2022-12-29", "pcd": "2027-11-01", "summary": "This is a Phase III, randomized, open-label, multicenter, global study to compare the efficacy and safety of Datopotamab Deruxtecan (Dato-DXd) in combination with durvalumab and carboplatin compared with pembrolizumab in combination with histology-specific platinum-based chemotherapy as first-line treatment of adults with stage IIIB, IIIC, or IV NSCLC without actionable genomic alterations (including sensitizing EGFR mutations, and ALK and ROS1 rearrangements).", "eligibility": "Inclusion:  * Participants ≥ 18 years at screening * Histologically or cytologically documented NSCLC that at the time of randomisation is Stage IIIB or IIIC disease not amenable to surgical resection or definitive chemoradiation or Stage IV metastatic disease * Lacks sensitising EGFR tumour tissue mutation and ALK and ROS1 rearrangements and has no documented tumour geno  ≥ 12 weeks. 5. Having sufficient bone marrow and organ function. 6. Participants must give informed consent to this study prior to the trial and voluntarily sign a written informed consent form.  Exclusion Criteria  1. Patients with central nervous system or meningeal metastases. 2. Spinal cord compression that cannot be cur"}, {"nct": "NCT07063745", "title": "A Study to Compare the Combination of Navlimetostat (BMS-986504) With Pembrolizumab and Chemotherapy Versus Placebo Plus Pembrolizumab and Chemotherapy in First-line Metastatic Non-small Cell Lung Cancer Participants With Homozygous MTAP Deletion", "phase": "Phase 3", "phase_full": "PHASE2;PHASE3", "status": "RECRUITING", "cluster": 0, "x": 29.17685610053136, "y": -23.47868089487769, "regimen": "platinum doublet", "add": "IO", "B": "carboplatin;cisplatin;nab-paclitaxel;paclitaxel;pembrolizumab;pemetrexed", "A": NaN, "targets": "MTAP", "modalities": "Small Molecule", "tme": 0, "bio": "—", "sponsor": "Bristol-Myers Squibb", "scale": 764, "enroll": 590, "big": 1, "start": "2026-01-02", "pcd": "2031-08-12", "summary": "The purpose of this study is to compare the clinical benefit of the combination of Navlimetostat (BMS-986504) (a selective MTA-cooperative inhibitor of PRMT5) plus pembrolizumab and chemotherapy versus placebo plus pembrolizumab and chemotherapy in first-line metastatic non-small cell lung cancer participants with homozygous MTAP deletion", "eligibility": "Inclusion Criteria  * Participants must have Metastatic (Stage IV or recurrent) non-small cell lung cancer (NSCLC) (as defined by the American Joint Committee on Cancer, Ninth Edition) with no prior systemic anti-cancer therapy for metastatic disease. * Participants must have histologically confirmed diagnosis of NSCLC and homozygous methylthioadenosine phosphorylase (MTAP) deletion or MTAP loss. * Participants must have an Eastern Cooperative Oncology Group (ECOG) performance status of 0-1. * Participants must have at least 1 measurable lesion as per RECIST v1.1.  Exclusion Criteria  * Nonsquamous participants must not have documented targetable oncogenic mutation or actionable genetic alte"}, {"nct": "NCT07079475", "title": "Study of Oral EGFR Inhibitor DZD6008 Combined With Sunvozertinib in Patients Who Have Advanced NSCLC With EGFR Mutations (TIAN-SHAN8)", "phase": "Phase 2", "phase_full": "PHASE1;PHASE2", "status": "RECRUITING", "cluster": 3, "x": -116.21251464937136, "y": -174.389122694148, "regimen": "osimertinib", "add": "backbone only", "B": "osimertinib", "A": "dzd6008;sunvozertinib", "targets": "EGFR", "modalities": "Small Molecule", "tme": 0, "bio": "EGFR_mut", "sponsor": "Dizal Pharmaceuticals", "scale": 29, "enroll": 220, "big": 0, "start": "2025-07-30", "pcd": "2028-06", "summary": "This study will treat patients with advanced NSCLC harboring EGFR mutations. This is the first study to test DZD6008 combined with sunvozertinib in patients, which will help to understand what type of side effects with the treatment. It will also measure the levels of two drugs in the body and preliminarily assess the anti-tumor activity with the combination treatment", "eligibility": "Inclusion Criteria:  1. Participants must be able to provide documented informed consent. 2. Aged ≥ 18 years. 3. Histologically or cytologically confirmed diagnosis of non-squamous NSCLC, locally advanced or metastatic, not suitable for curative therapy. 4. Documentation of EGFR mutation from a local certified laboratory. Part A: EGFR mutations (excluding participants only harboring EGFR exon20ins). Part B: EGFR sensitizing mutations (Exon19del and/or L858R) with or without T790M/C797S resistance mutations. 5. Provide adequate baseline tumor and plasma samples. For part A: tumor samples collected after disease progression on the last EGFR TKI treatment. For part B: tumor samples of B1 and B2"}, {"nct": "NCT07098338", "title": "A Study of Novel Combinations in Non-Small Cell Lung Cancer (NSCLC)", "phase": "Phase 2", "phase_full": "PH  progression on EGFR tyrosine kinase inhibitor.", "eligibility": "Inclusion Criteria:  1. Willing and able to provide signed and dated informed consent; 2. Patients at least 18 years of age; 3. Locally advanced or metastatic non-small cell lung cancer (NSCLC); 4. Objective disease progression following prior EGFR-TKI therapy; 5. EGFR mutation with MET amplification/Overexpression by a central laboratory; 6. Measurable lesions based on RECIST 1. 1; 7. ECOG performance status 0 or 1; 8. Expected survival \\>12 weeks; 9. Adequate bone marrow reserve or organ function.  Exclusion Criteria:  1. Prior or ongoing treatment with any c-Met target; 2. Previously received systemic chemotherapy; 3. Patients requiring continuous use of systemic immunosuppressants or sys"}, {"nct": "NCT07122687", "title": "IBI363 Combined With Chemotherapy or Pembrolizumab Combined With Chemotherapy as Neoadjuvant Therapy in Resectable Stage IB-III Non-Squamous Non-Small Cell Lung Cancer", "phase": "Phase 2", "phase_full": "PHASE2", "status": "RECRUITING", "cluster": 0, "x": 19.01903564426769, "y": -94.57630614134482, "regimen": "platinum doublet", "add": "IO", "B": "carboplatin;cisplatin;pembrolizumab;pemetrexed", "A": "carboplatin;cisplatin;ibi363;pemetrexed", "targets": "PD-1", "modalities": "Bispecific Antibody", "tme": 1, "bio": "EGFR_mut, ALK", "sponsor": "Innovent Biologics (Suzhou) Co. Ltd.", "scale": 107, "enroll": 170, "big": 0, "start": "2025-08-26", "pcd": "2026-11-30", "summary": "This study is a randomized, open-label Phase 2 study to compare the efficacy and safety of IBI363 Combined with Chemotherapy or Pembrolizumab Combined with Chemotherapy as Neoadjuvant Therapy in Resectable Stage IB-III Non-Squamous Non-Small Cell Lung Cancer.", "eligibility": "Inclusion Criteria:  1. Males and Females, age ≥18 years and ≤75 years; 2. Histologically or cytologically confirmed primary non-squamous NSCLC:     * Stage IB, II, IIIA or IIIB (N2) NSCLC (per AJCC8);    * No administration of any an const HL=3, NPHASE=3, ALPHAS=[0.35, 0.65, 1.0];
const CC={}; CLUSTERS.forEach(c=>CC[c.id]=c.color);
const gd=document.getElementById('map');

// cluster overview
const cl=document.getElementById('clusters');
CLUSTERS.forEach(c=>{ const d=document.createElement('div'); d.className='clu';
  d.innerHTML=`<span class="dot" style="background:${c.color}"></span>
    <div><b>C${c.id}</b> · ${c.name} <span class="sub">(n=${c.n})</span>
    <div class="sub">대표: ${c.rep} · B: ${c.B}</div></div>`;
  cl.appendChild(d); });

// company dropdown (scale desc)
const sel=document.getElementById('company');
COMPANIES.forEach(c=>{ const o=document.createElement('option'); o.value=c.name;
  o.textContent=`${c.name} — R&D ${c.scale} · ${c.n} trial${c.n>1?'s':''}${c.big?'  ★':''}`;
  sel.appendChild(o); });

function fmtDate(s){ return s && s!=='nan' ? s : '—'; }
function card(t){ const url='https://clinicaltrials.gov/study/'+t.nct;
  const reg = t.regimen + (t.add && t.add!=='chemo only' ? ' + '+t.add : '');
  return `<div class="card" style="border-left-color:${CC[t.cluster]||'#ccc'}">
    <a href="${url}" target="_blank"><b>${t.nct}</b> ↗</a>${t.big?'<span class="big">★ big pharma</span>':''}
    <div class="title">${t.title}</div>
    <div class="row"><span class="chip ph">${t.phase}</span><span class="chip st">${t.status}</span>
      <span class="chip">C${t.cluster}</span>${t.tme?'<span class="chip tme">TME 관련</span>':''}
      <span class="chip">enroll ${t.enroll??'—'}</span></div>
    <div class="row"><b>표준치료 레지멘(B):</b> ${reg}　<span class="muted">[${t.B}]</span></div>
    <div class="row"><b>실험약(A):</b> ${t.A}</div>
    <div class="row"><b>타겟:</b> ${t.targets}　<b>모달리티:</b> ${t.modalities}</div>
    <div class="row"><b>바이오마커(eligibility):</b> ${t.bio}</div>
    <div class="row"><b>스폰서:</b> ${t.sponsor} <span class="muted">(R&D scale ${t.scale})</span></div>
    <div class="row muted">시작 ${fmtDate(t.start)} · 1차완료(예정) ${fmtDate(t.pcd)}</div>
    ${t.summary?`<details class="sum"><summary>연구 요약</summary><p>${t.summary}</p></details>`:''}
    ${t.eligibility?`<details class="sum"><summary>선정기준(발췌)</summary><p>${t.eligibility}</p></details>`:''}
  </div>`; }

function renderCards(ts, head){
  document.getElementById('cards').innerHTML =
    `<div class="cnt">${head}</div>` + (ts.length? ts.map(card).join('') : '<div class="muted">해당 임상 없음</div>');
}

function highlight(coords){
  // 빨간 링만 표시(나머지는 흐리게 하지 않음)
  Plotly.restyle('map', {x:[coords.map(c=>c[0])], y:[coords.map(c=>c[1])]}, [HL]);
}

function showCompany(name){
  if(name==='__ALL__'){ highlight([]); renderCards([], '전체 보기 — 제약사를 선택하세요'); return; }
  const ts=TRIALS.filter(t=>t.sponsor===name).sort((a,b)=>a.cluster-b.cluster);
  highlight(ts.map(t=>[t.x,t.y]));
  renderCards(ts, `${name} — ${ts.length} trial${ts.length>1?'s':''}`);
}
sel.addEventListener('change', e=>showCompany(e.target.value));
document.getElementById('reset').addEventListener('click', ()=>{ sel.value='__ALL__'; showCompany('__ALL__'); });

if(gd && gd.on){ gd.on('plotly_click', ev=>{
  const nct=ev.points[0].customdata? ev.points[0].customdata[0]: null; if(!nct) return;
  const t=TRIALS.find(x=>x.nct===nct); if(!t) return;
  sel.value=t.sponsor; highlight([[t.x,t.y]]);
  renderCards([t], `${t.nct} · ${t.sponsor}`);
  document.getElementById('cards').scrollTop=0;
});}
