<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="ttl"></title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;overflow:hidden;color:#1f2937;background:#f1f5f9;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
  header{flex:0 0 auto;background:#0f172a;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700}
  header .sub{color:#94a3b8;font-size:11px}
  .ctrl{margin-left:auto;display:flex;align-items:center;gap:8px}
  .ctrl label{font-size:12px;color:#cbd5e1}
  .lang{display:flex;border:1px solid #334155;border-radius:8px;overflow:hidden}
  .lang button{background:#1e293b;color:#94a3b8;border:0;padding:6px 10px;font-size:12px;cursor:pointer}
  .lang button.on{background:#2563eb;color:#fff}
  select{padding:7px 10px;border:1px solid #334155;border-radius:8px;font-size:13px;background:#fff;min-width:300px}
  #reset{padding:7px 12px;border:1px solid #475569;background:#1e293b;color:#fff;border-radius:8px;font-size:12px;cursor:pointer}
  .wrap{flex:1 1 auto;min-height:0;display:flex;gap:12px;padding:12px;overflow:hidden}
  .map{flex:1 1 60%;min-width:0;height:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:6px;overflow:hidden}
  .map .js-plotly-plot,.map .plotly-graph-div{height:100%!important;width:100%!important}
  .side{flex:1 1 40%;min-width:340px;max-width:560px;height:100%;display:flex;flex-direction:column;gap:12px;overflow:hidden}
  .panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 13px}
  .panel.clusters{flex:0 0 auto;max-height:26vh;overflow:auto}
  .panel.cards{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .muted{color:#64748b;font-size:12px}
  details summary{cursor:pointer;font-size:13px;font-weight:600;margin-bottom:6px}
  .clu{display:flex;gap:8px;padding:5px;border-radius:7px;font-size:12px}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-top:3px;flex:0 0 auto}
  .clu .sub{color:#64748b;font-size:11px}
  .cnt{flex:0 0 auto;color:#334155;font-size:13px;font-weight:600;margin:0 0 8px}
  #cards{flex:1 1 auto;min-height:0;overflow:auto}
  .card{border:1px solid #e5e7eb;border-left-width:6px;border-radius:9px;padding:10px 12px;margin-bottom:10px;background:#fff}
  .card a{color:#2563eb;text-decoration:none;font-size:13px}.card a:hover{text-decoration:underline}
  .title{font-size:12.5px;margin:4px 0 6px;color:#111827;line-height:1.35}
  .row{font-size:12px;color:#374151;margin:3px 0}.row b{color:#0f172a}
  .chip{display:inline-block;border-radius:5px;font-size:11px;padding:1px 7px;margin:0 4px 3px 0;background:#eef2ff;color:#3730a3}
  .chip.ph{background:#ecfeff;color:#155e75}.chip.st{background:#f1f5f9;color:#334155}.chip.tme{background:#fef2f2;color:#b91c1c}
  .big{background:#111827;color:#fff;border-radius:4px;font-size:10px;padding:1px 6px;margin-left:6px}
  details.sum{margin-top:6px}details.sum summary{font-size:11.5px;color:#2563eb;font-weight:500}
  details.sum p{font-size:11.5px;color:#475569;margin:5px 0 0;line-height:1.45}
</style></head>

2015-01", "pcd": "2026-12", "summary": "This clinical trial is an open label Phase II study of the combination of intravenously administered SGT-53 and gemcitabine/nab-paclitaxel in patients with metastatic pancreatic cancer. The objective of the study is to evaluate the safety, tolerability, toxicity and efficacy (specifically Progression Free Survival at 5.5 month (PFS5.5mos)) of this combination therapy.", "eligibility": "Inclusion Criteria:  * Patients with histologic or cytologic diagnosis of stage IV metastatic pancreatic adenocarcinoma. * One or more tumors measurable on CT scan. * Eastern Cooperative Oncology Group (ECOG) performance status ≤ 1. * Life expectancy of at least 3 months. * Age ≥ 18 years. * Signed, written IRB-approved informed consent. * A negative pregnancy test (if female and of child-bearing potential). * Acceptable liver function:    * Bilirubin ≤ 1.5 times upper limit of normal   * AST (SGOT), ALT (SGPT) ≤ 3.0 x ULN   * Serum creatinine ≤ 1.5 X ULN * Acceptable hematologic status:    * Absolute neutrophil count ≥ 1500 cells/mm³   * Platelet count ≥ 100,000 (plt/mm³)   * Hemoglobin ≥ 1"}, {"nct": "NCT02568267", "title": "Basket Study of Entrectinib (RXDX-101) for the Treatment of Patients With Solid Tumors Harboring NTRK 1/2/3 (Trk A/B/C), ROS1, or ALK Gene Rearrangements (Fusions)", "phase": "Phase 2", "status": "ACTIVE_NOT_RECRUITING", "cluster": 2, "x": -6.897433770922969, "y": 1141.1975832948, "regimen": "ALK/ROS1_TKI", "add": "—", "B": "entrectinib", "A": "entrectinib", "targets": "ROS1", "modalities": "Small Molecule", "tme": 0, "bio": "-", "sponsor": "Hoffmann-La Roche", "scale": 922, "enroll": 534, "big": 1, "start": "2015-11-19", "pcd": "2027-06-30", "summary": "This is an open-label, multicenter, global Phase 2 basket study of entrectinib (RXDX-101) for the treatment of patients with solid tumors that harbor an NTRK1/2/3, ROS1, or ALK gene fusion. Patients will be assigned to different baskets according to tumor type and gene fusion.", "eligibility": "Inclusion Criteria:  * Histologically- or cytologically-confirmed diagnosis of locally advanced or metastatic solid tumor that harbors an NTRK1/2/3, ROS1, or ALK gene rearrangement * For patients enrolled via local molecular testing, an archival or fresh tumor tissue (unless medically contraindicated) is required to be submitted for independent central molecular testing at Ignyta's CLIA laboratory post-enrollment * Measurable or evaluable disease * Patients with CNS involvement, including leptomeningeal carcinomatosis, which is either asymptomatic or previously-treated and controlled, are allowed * Prior anticancer therapy is allowed (excluding approved or investigational Trk, ROS1, or ALK i"}, {"nct": "NCT03257033", "title": "Intra-arterial Gemcitabine vs. IV Gemcitabine and Nab-Paclitaxel Following Radiotherapy for LAPC", "phase": "Phase 3", "status": "RECRUITING", "cluster": 1, "x": 519.6763271122257, "y": 8.939152806391153, "regimen": "gemcitabine", "add": "—", "B": "gemcitabine;nab-paclitaxel;paclitaxel", "A": "device: renovocath;gemcitabine", "targets": NaN, "modalities": "Small Molecule", "tme": 0, "bio": "-", "sponsor": "RenovoRx", "scale": 2, "enroll": 190, "big": 0, "start": "2018-03-12", "pcd": "2027-06", "summary": "The study is a multi-center, open-label, randomized active controlled study of subjects with locally advanced pancreatic adenocarcinoma which is unresectable.", "eligibility": "Inclusion Criteria:  1. Histologically or Cytopathology confirmed pancreatic adenocarcinoma with initial diagnosis within 8 weeks of consent for patients who enroll at cycle 1, and from the start of cycle 1 of gemcitabine + nab-paclitaxel chemotherapy for patients who enroll at cycle 2 2. Locally advanced, unresectable disease at screening and prior to randomization, as defined by NCCN criteria determined by an on-site, experienced, multidisciplinary team (as confirmed by CT or MRI within 30 days of the start of cycle 1) 3. Eastern Cooperative Oncology Group (ECOG) Performance Status (PS) of 0 or 1 4. Age ≥ 18 years 5. Adequate laboratory values prior to receiving the first dose of nab-pacli"}, {"nct": "NCT03816163", "title": "A Study of Zolbetuximab (IMAB362) in Adults With Pancreatic Cancer", "phase": "Phase 2", "status": "ACTIVE_NOT_RECRUITING", "cluster": 1, "x": 503.6613983216047, "y": 80.6593083158025, "regimen": "gemcitabine", "add": "—", "B": "gemcitabine;nab-paclitaxel;paclitaxel", "A": "gemcitabine;nab-paclitaxel;zolbetuximab", "targets": "CLDN18.2", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "-", "sponsor": "Astellas Pharma Global Development, Inc.", "scale": 171, "enroll": 393, "big": 1, "start": "2019-03-15", "pcd": "2026-08-31", "summary": "Zolbetuximab is being studied as a treatment for people with pancreatic cancer. Most people with pancreatic cancer have a protein called Claudin 18.2 (CLDN18.2) in their tumor. Zolbetuximab is thought to work by attaching to CLDN 18.2 in their tumor. This switches on the body's immune system to attack the tumor. Zolbetuximab is a potential treatment for people with pancreatic cancer.  There is an unmet medical need to treat people with pancreatic cancer. This study will help find the dose of zolbetuximab to be used with chemotherapy and provide more information on this treatment in adults with", "eligibility": "Inclusion Criteria:  * A female subject is eligible to participate if she is not pregnant or lactating and at least 1 of the following conditions applies:    * Not a woman of childbearing potential (WOCBP) OR   * WOCBP who agrees to follow the contraceptive guidance throughout the treatment period and for at least 6 months after the final study drug administration. * Female subject must agree not to breastfeed starting at screening and throughout the study period, and for 6 months after the final study drug administration. * Female subject must not donate ova starting at screening and throughout the study period, and for 6 months after the final study drug administration. * A male subject wi"}, {"nct": "NCT03899636", "title": "A Pivotal Study of Safety and Effectiveness of NanoKnife IRE for Stage 3 Pancreatic Cancer", "phase": "Phase 3", "status": "ACTIVE_NOT_RECRUITING", "cluster": 0, "x": -634.796159045199, "y": -208.62421553723817, "regimen": "FOLFIRINOX", "add": "—", "B": "FOLFIRINOX", "A": "device: nanoknife system;modified folfirinox", "targets": NaN, "modalities": NaN, "tme": 0, "bio": "-", "sponsor": "Angiodynamics, Inc.", "scale": 8, "enroll": 528, "big": 0, "start": "2021-02-23", "pcd": "2025-04", "summary": "Subjects will be offered the opportunity to participate in a randomized, controlled, 2-arm, unblinded multicenter trial (RCT). There will be 2 study arms: the control arm receiving chemotherapy with the modified FOLFIRINOX regimen alone; and the irreversible electroporation (IRE) arm, receiving chemotherapy with the modified FOLFIRINOX regimen followed by IRE with the NanoKnife System using either an open or a percutaneous approach. All subjects will be treated with the modified FOLFIRINOX regimen for at least 3 months; randomization to either control or IRE arm will take place at the time of ", "eligibility": "Inclusion Criteria:  1. Provision of signed and dated informed consent form. 2. Subject is 18 years of age and older. 3. Subject has a diagnosis of unresectable Stage 3 pancreatic adenocarcinoma cancer cytologically or pathologically confirmed per American Joint Committee on Cancer (AJCC) staging criteria. 4. Subject has a tumor evaluated as Stage 3 according to National Comprehensive Cancer Network (NCCN) guidelines, based on radiographic imaging or exploratory surgery. 5. Maximum axial and anterior to posterior tumor dimension of ≤3.5cm, after receiving three months of treatment with the modified FOLFIRINOX regimen. 6. Subject has received 3 months of treatment with the modified FOLFIRINOX"}, {"nct": "NCT03983954", "title": "Naptumomab Estafenatox in Combination With Durvaluma ia; * Subject has an ECOG score of 0-1 and is expected to survive more than 3 months; * Subjects have a good level of organ function.  Exclusion Criteria:  * Subject suitable for potentially curative surgery. * The subject confirmed by tissue or cytology as other pathological types, such as acinar cell carcinoma, neuroendocrine carcinoma, etc. * The subject has previously received gemcitabine and nab-paclitaxel combination therapy within 6 months of"}, {"nct": "NCT06752811", "title": "Polymeric Micellar Paclitaxel for Metastatic Pancreatic Cancer", "phase": "Phase 3", "status": "RECRUITING", "cluster": 6, "x": 97.05296900044235, "y": -655.66451673715, "regimen": "gemcitabine", "add": "—", "B": "gemcitabine;paclitaxel", "A": "gemcitabine hydrochloride for injection;paclitaxel polymeric micelles for injection", "targets": "TUB", "modalities": "Small Molecule", "tme": 0, "bio": "-", "sponsor": "Shanghai Yizhong Pharmaceutical Co., Ltd.", "scale": 3, "enroll": 416, "big": 0, "start": "2025-02-05", "pcd": "2027-07-01", "summary": "This trial is a multi-center, randomized, open, parallel-group and positive-controlled phase III trial to evaluate the efficacy and safety of paclitaxel polymeric micelles for injection plus gemcitabine as first-line treatment of metastatic pancreatic cancer compared with nab-Paclitaxel plus gemcitabine.", "eligibility": "Inclusion Criteria:  * 1\\) Men or women aged 18 to 75 years old (including the critical value). * 2）Metastatic pancreatic cancer confirmed by histology or cytology. * 3）Patients who have not previously received any systemic therapy (including chemotherapy, targeted, and immunotherapy), radiotherapy, surgery, or investigational drugs for the treatment of metastatic pancreatic cancer; Patients who have previously received neoadjuvant or adjuvant chemotherapy could be enrolled if the interval between last treatment and recurrence and metastasis is more than 6 months. * 4）Eastern Cooperative Oncology Group (ECOG) performance status of 0-2. * 5）Survival is expected to be at least 3 months. * 6）At"}, {"nct": "NCT06767813", "title": "Clinical Study of TQB2868 Injection Combined With Anlotinib Capsule and Chemotherapy in the First-line Treatment of Metastatic Pancreatic Neoplasms", "phase": "Phase 2", "status": "RECRUITING", "cluster": 6, "x": 114.79012677891873, "y": -578.165629116282, "regimen": "gemcitabine", "add": "—", "B": "gemcitabine;paclitaxel", "A": "albumin paclitaxel injection;anlotinib capsules;gemcitabine injection;tqb2868 injection", "targets": "VEGF/VEGFR", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "-", "sponsor": "Chia Tai Tianqing Pharmaceutical Group Nanjing Shunxin Pharmaceutical Co., Ltd.", "scale": 36, "enroll": 80, "big": 0, "start": "2024-03-19", "pcd": "2026-11", "summary": "To evaluate the efficacy and safety of TQB2868 injection combined with anlotinib capsule and chemotherapy in treated patients with Pancreatic Neoplasms", "eligibility": "Inclusion Criteria:  * Subjects must voluntarily participate in the study and sign the informed consent form. * Aged between 18 and 75 years (inclusive) at the time of signing the informed consent form. * Diagnosed with pancreatic ductal adenocarcinoma through histological or cytological confirmation. * Have at least one evaluable metastatic lesion according to RECIST 1.1 criteria; * No prior systemic anti-tumor therapy (including but not limited to chemotherapy, radiotherapy, targeted therapy, or immunotherapy). Patients who experience disease progression more than 6 months after completing neoadjuvant or adjuvant therapy are eligible. * Eastern Cooperative Oncology Group (ECOG) performance"}, {"nct": "NCT06821503", "title": "Clinical Study Evaluating the Safety, Tolerability, and Preliminary Efficacy of LM-108 ± Penpulimab+Chemotherapy in Advanced Solid Tumors - Cohort C", "phase": "Phase 2", "status": "RECRUITING", "cluster": 6, "x": 45.97473836233846, "y": -606.6198014487758, "regimen": "gemcitabine", "add": "—", "B" ", "sponsor": "EXACT Therapeutics AS", "scale": 2, "enroll": 25, "big": 0, "start": "2025-06-19", "pcd": "2026-12-15", "summary": "The purpose of the study is to assess the efficacy and safety of Acoustic Cluster Therapy (ACT) when given in addition to chemotherapy for treatment of Locally Advanced Pancreatic Cancer.", "eligibility": "Inclusion Criteria:  * Not deemed suitable for primary curative surgery and have radiographic and pathological disease consistent with inoperable LAPC or borderline resectable pancreatic cancer. * Suitable to receive treatment with mFOLFIRINOX according to the Investigator's assessment.  Exclusion Criteria:  • Any prior anti-cancer treatment for pancreatic cancer (e.g. chemotherapy, surgery, radiation). Palliative bypass procedure and bile duct stenting are allowed."}, {"nct": "NCT06943755", "title": "Zanzalintinib Versus Everolimus in Participants With Locally Advanced or Metastatic Neuroendocrine Tumors", "phase": "Phase 3", "status": "RECRUITING", "cluster": 2, "x": -531.8071057890143, "y": 545.6014524546417, "regimen": "mTOR", "add": "—", "B": "everolimus", "A": "zanzalintinib", "targets": "EGFR", "modalities": "Small Molecule", "tme": 0, "bio": "-", "sponsor": "Exelixis", "scale": 52, "enroll": 440, "big": 0, "start": "2025-07-21", "pcd": "2029-06-30", "summary": "The primary purpose of this study is to assess the effectiveness of zanzalintinib compared to everolimus in participants with previously treated, unresectable, locally advanced or metastatic neuroendocrine tumors.", "eligibility": "Key Inclusion Criteria:  * Histologically confirmed, locally advanced/unresectable or metastatic, well-differentiated Grade 1, 2, or 3 NETs of pancreatic origin or extra-pancreatic origin. * Allowed prior lines of therapy, based on the site of NET and functional status. * Documented radiographic disease progression per RECIST 1.1, as assessed by the Investigator based on imaging assessments (computed tomography \\[CT\\] or magnetic resonance imaging \\[MRI\\]) within 12 months before randomization. * Measurable disease according to RECIST 1.1 as determined by the Investigator. * Archival tumor tissue is required, if available. If archival tumor tissue is not available, a fresh biopsy may be subm"}, {"nct": "NCT06953999", "title": "A Phase III Study of Ivonescimab + Chemo With/Without AK117 in Metastatic Pancreatic Cancer", "phase": "Phase 3", "status": "RECRUITING", "cluster": 6, "x": 96.98636439039886, "y": -583.5817166931442, "regimen": "gemcitabine", "add": "—", "B": "gemcitabine;paclitaxel", "A": "ak117;ak117 placebo;albumin-bound paclitaxel;gemcitabine;ivonescimab", "targets": "EGFR", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "-", "sponsor": "Akeso", "scale": 103, "enroll": 999, "big": 0, "start": "2025-06-11", "pcd": "2027-05-14", "summary": "This is a Phase 3, randomized, double-blind clinical trial aimed at evaluating the efficacy and safety of Ivonescimab plus chemotherapy with or without AK117 versus placebo plus chemotherapy in patients with metastatic pancreatic cancer. The study seeks to determine whether the addition of Ivonescimab and/or AK117 improves clinical outcomes compared to standard chemotherapy alone. Participants will be randomly assigned to receive either Ivonescimab with/without AK117 or placebo, both in combination with chemotherapy.", "eligibility": "Inclusion Criteria:  1. Voluntarily sign a written informed consent form. 2. Age at enrollment is ≥ 18 and ≤ 75 years, both males and females are eligible. 3. Eastern Cooperative Oncology Group (ECOG) performance status of 0 or 1. 4. Life expectancy of ≥ 3 months. 5. Histologically or cytologically confirmed, unresectable metastatic pancreatic ductal adenocarcinoma (PDAC). 6. No prior systemic anti-cancer treatment for metastatic PDAC. 7. At least one measurable lesion per Response Evaluation Criteria in Solid Tumors (RECIST) v1.1. 8. Adequate organ function.  Exclusion Criteria:  1. Histologically or cytologically confirmed other types of pancreatic malignancies or mixed histology types. 2."}, {"nct": "NCT07024615", "title": "A Study of ASP2138 Given Before Surgery, Then Chemotherapy After Surgery, in People With Pancreatic Ductal Cancer", "phase": "Phase 1", "status": "RECRUITING", "cluster": 2, "x": -738.7570371251315, "y": -630.3869184890815, "regimen": "FOLFOXIRI", "add": "—", "B": "FOLFOXIRI;capecitabine;gemcitabine;nab-paclitaxel;paclitaxel", "A": "asp2138;capecitabine;fluorouracil;gemcitabine;irinotecan;leucovorin;nab-paclitaxel;oxaliplatin", "targets": "CLDN18.2", "modalities": "Monoclonal Antibody", "tme": 1, "bio": "-", "sponsor": "Astellas Pharma Global Development, Inc.", "scale": 171, "enroll": 25, "big": 1, "start": "2025-10-16", "pcd": "2028-01-31", "summary": "Some people with pancreatic ductal cancer (PDAC) have a protein called Claudin 18.2 (CLDN18.2) in their tumor. ASP2138 is thought to work by binding to CLDN18.2 and a protein on a type of immune cell called a T-cell. The T-cell \"tells\" the immune system to attack the tumor. This study is for people with resectable PDAC. Resectable means that the tumor can be removed by surgery.  In this study, adults with resectable PDAC will receive an ASP2138 injection just below the skin (subcutaneous) 2 weeks before surgery. After surgery, they will be given standard chemotherapy treatments chosen by their", "eligibility": "Inclusion Criteria:  * Participant has histologically confirmed localized pancreatic adenocarcinoma which is deemed upfront resectable based on institutional multi-disciplinary review. Participant with localized pancreatic adenocarcinoma cannot have received any prior therapy. * Participant has confirmation of positive claudin (CLDN)18.2 test result by local laboratory prior to first dose of study intervention (ASP2138 dosing may be allowed after discussion with the medical monitor, if results are pending or a biopsy for CLDN18.2 testing is not clinically appropriate). Site should contact the sponsor to assess potential eligibility based on a local test result. * Participant has an available"}, {"nct": "NCT07033689", "title": "Feasibility Study of Suizenji, in Patients With Unresectable Pancreatic Ductal Adenocarcinoma (SUNRISE-II)", "phase": "Phase 1", "status": "RECRUITING", "cluster": 0, "x": -651.6848350429628, "y": -192.10271305257996, "regimen": "FOLFIRINOX", "add": "—", "B": "FOLFIRINOX;fluorouracil", "A": "device: suizenji (an ultrasound-guided hifu therapy system);gem/nab-ptx;mfolfirinox adjuvant;nal-iri/fl", "targets": "IRI", "modalities": "Small Molecule", "tme": 0, "bio": "-", "sponsor": "SONIRE Therapeutics Inc.", "scale": 2, "enroll": 10, "big": 0, "start": "2026-01-05", "pcd": "2026-12-01", "summary": "This is a feasibility, safety, tolerability, and efficacy research study of an investigational device called \"Suizenji\", an ultrasound-guided high-intensity focused ultrasound (HIFU) therapy system for the treatment of unresectable pancreatic ductal adenocarcinoma. Focused ultrasound therapy uses a number of small ultrasound generators attached to a bowl-shaped ultrasound generator to emit ultrasound waves from outside to inside the body and focus them on a single point where cancerous cells in the pancreas are located. The targeted area is then heated, which kills the pancreatic cancer cells,", "eligibility": "1. Signed an Institutional Review Board (IRB) approved informed consent document. 2. Men and women ≥ 18 years of age. 3. Histologically or cytologically diagnosed PDAC. 4. Newly diagnosed unresectable\\*, locally advanced or metastatic disease. (\\* defined as not \"Resectable\" and not \"borderline resectable\" based on \"Criteria Defining Resectability at Diagnosis\" in NCCN Guideline 2024) 5. Primary tumor accessible to HIFU treatment and visualized on transabdominal ultrasonography. 6. Primary tumor site must be a measurable lesion according to RECIST version 1.1 at baseline. 7. ECOG Performance Status (ECOG-PS) of 0 - 1. 8. Life expectancy ≥ 3 months. 9. Adequate organ function defined by:     "}, {"nct": "NCT07049055", "title": "A Clinical Trial to Evaluate EDV Nanocell Therapy With Gemcitabine and Nab-paclitaxel in Pancreatic Cancer", "phase": "Phase 2", "status": "RECRUITING", "cluster": 1, "x": 553.5058020457507, "y": 68.87125564698965, "regimen": "gemcitabine", "add": "—", "B": "gemcitabine;nab-paclitaxel;paclitaxel", "A": "e-edv-d682;edv-gc;gemcitabine;nab paclitaxel.", "targets": "EGFR", "modalities": "Small Molecule", "tme": 0, "bio": "-", "sponsor": "Engeneic Pty Limited", "scale": 2, "enroll": 144, "big": 0, "start": "2026-01-12", "pcd": "2028-09", "summary": "The purpose of this study is to evaluate the safety and tolerability and overall survival (OS) of E-EDV-D682/GC in combination with gemcitabine and nab-paclitaxel versus gemcitabine and nab-paclitaxel alone in participants with metastatic pancreatic ductal adenocarcinoma (PDAC) who have progressed on therapy.", "eligibility": "Inclusion Criteria:  * Histological or pathological confirmation of metastatic pancreas adenocarcinoma. Cytological or histological evidence of metastatic disease is required. * Male or Female greater than or equal to 18 years of age. * Eastern Cooperative Oncology Group (ECOG) performance score of 0-1. * Life expectancy ≥ 3 months in the opinion of the Investigator. * Measurable disease as per iRECIST criteria. * Subjects must have tumors that express EGFR. * Documented disease progression with first line FOLFIRINOX or NALIRIFOX therapy, during or within 3 months (+/- 15 days) after end of therapy. * No more than one line of prior systemic therapy for metastatic PDAC allowed. * Albumin leve"}, {"nct": "NCT07076121", "title": "A Study Comparing Navlimetostat (BMS-986504) in Combination With Nab-paclitaxel and Gemcitabine Versus Placebo in Combination With Nab-paclitaxel and Gemcitabine in Participants With Untreated Metastatic Pancreatic Ductal Adenocarcinoma With Homozygous MTAP Deletion (MountainTAP-30 const HL=3, CK="췌장암", CE="Pancreatic";
const CC={}; CLUSTERS.forEach(c=>CC[c.id]=c.color);
const gd=document.getElementById('map');

const I18N={
 ko:{cancer:CK, title:c=>`${c} 임상 코호트 대시보드`,
     sub:c=>`진행 중 ${c} · 제약사 주도 · 표준치료 코호트 (색=클러스터 · 투명도=Phase · 크기=R&D 규모 · 테두리=빅파마)`,
     sponsor:"제약사", all:"— 전체 보기 —", reset:"초기화",
     clusters:"클러스터 개요 (표준치료 아키타입)", rep:"대표", near:"(빅파마 없음·최근접)",
     hint:"상단에서 제약사를 선택하거나 맵의 점을 클릭하세요.",
     reg:"표준치료 레지멘(B)", A:"실험약(A)", target:"타겟", modality:"모달리티",
     bio:"바이오마커(eligibility)", spon:"스폰서", start:"시작", pcd:"1차완료(예정)",
     summary:"연구 요약", elig:"선정기준(발췌)", trials:n=>`${n}건`, scale:"R&D 규모"},
 en:{cancer:CE, title:c=>`${c} clinical-cohort dashboard`,
     sub:c=>`Ongoing ${c} · industry-sponsored · standard-of-care cohorts (color=cluster · opacity=phase · size=R&D scale · outline=big pharma)`,
     sponsor:"Sponsor", all:"— Show all —", reset:"Reset",
     clusters:"Cluster overview (standard-of-care archetypes)", rep:"Rep", near:"(no big pharma · nearest)",
     hint:"Select a sponsor above, or click a point on the map.",
     reg:"Standard-of-care regimen (B)", A:"Experimental (A)", target:"Target", modality:"Modality",
     bio:"Biomarker (eligibility)", spon:"Sponsor", start:"Start", pcd:"Primary completion (est.)",
     summary:"Study summary", elig:"Eligibility (excerpt)", trials:n=>`${n} trial${n>1?'s':''}`, scale:"R&D"}
};
let lang=localStorage.getItem('lang')||'ko', T=I18N[lang];
let view={type:'none'};

function fmt(s){return s&&s!=='nan'?s:'—';}
function card(t){const url='https://clinicaltrials.gov/study/'+t.nct;
  const reg=t.regimen+(t.add&&!['chemo only','—','-','backbone only'].includes(t.add)?' + '+t.add:'');
  return `<div class="card" style="border-left-color:${CC[t.cluster]||'#ccc'}">
    <a href="${url}" target="_blank"><b>${t.nct}</b> ↗</a>${t.big?'<span class="big">★ big pharma</span>':''}
    <div class="title">${t.title}</div>
    <div class="row"><span class="chip ph">${t.phase}</span><span class="chip st">${t.status}</span>
      <span class="chip">C${t.cluster}</span>${t.tme?'<span class="chip tme">TME</span>':''}<span class="chip">enroll ${t.enroll??'—'}</span></div>
    <div class="row"><b>${T.reg}:</b> ${reg}</div>
    <div class="row"><b>${T.A}:</b> ${t.A}</div>
    <div class="row"><b>${T.target}:</b> ${t.targets}　<b>${T.modality}:</b> ${t.modalities}</div>
    <div class="row"><b>${T.bio}:</b> ${t.bio}</div>
    <div class="row"><b>${T.spon}:</b> ${t.sponsor} <span class="muted">(${T.scale} ${t.scale})</span></div>
    <div class="row muted">${T.start} ${fmt(t.start)} · ${T.pcd} ${fmt(t.pcd)}</div>
    ${t.summary?`<details class="sum"><summary>${T.summary}</summary><p>${t.summary}</p></details>`:''}
    ${t.eligibility?`<details class="sum"><summary>${T.elig}</summary><p>${t.eligibility}</p></details>`:''}
  </div>`;}
function renderCards(ts,head){document.getElementById('cards').innerHTML=`<div class="cnt">${head}</div>`+(ts.length?ts.map(card).join(''):`<div class="muted">—</div>`);}
function renderClusters(){document.getElementById('clusters').innerHTML='';
  CLUSTERS.forEach(c=>{const d=document.createElement('div');d.className='clu';
    d.innerHTML=`<span class="dot" style="background:${c.color}"></span>
      <div><b>C${c.id}</b> · ${c.name} <span class="sub">(n=${c.n})</span>
      <div class="sub">${T.rep}: ${c.rep}${c.near?' '+T.near:''} · B: ${c.B}</div></div>`;
    d.onclick=()=>{view={type:'cluster',id:c.id};
      const ts=TRIALS.filter(x=>x.cluster===c.id).sort((a,b)=>b.scale-a.scale);
      highlight(ts.map(x=>[x.x,x.y]));renderCards(ts,`C${c.id} — ${T.trials(ts.length)}`);};
    document.getElementById('clusters').appendChild(d);});}
function highlight(coords){Plotly.restyle('map',{x:[coords.map(c=>c[0])],y:[coords.map(c=>c[1])]},[HL]);}
function rebuildSelect(){const sel=document.getElementById('company');const cur=sel.value;
  sel.innerHTML=`<option value="__ALL__">${T.all}</option>`+COMPANIES.map(c=>
    `<option value="${c.name.replace(/"/g,'&quot;')}">${c.name} — ${T.scale} ${c.scale} · ${T.trials(c.n)}${c.big?'  ★':''}</option>`).join('');
  if(cur)sel.value=cur;}
function showCompany(name){view={type:'company',name};
  if(name==='__ALL__'){highlight([]);renderCards([],T.hint);return;}
  const ts=TRIALS.filter(t=>t.sponsor===name).sort((a,b)=>a.cluster-b.cluster);
  highlight(ts.map(t=>[t.x,t.y]));renderCards(ts,`${name} — ${T.trials(ts.length)}`);}
function rerender(){if(view.type==='company')showCompany(view.name);
  else if(view.type==='cluster'){const ts=TRIALS.filter(x=>x.cluster===view.id).sort((a,b)=>b.scale-a.scale);renderCards(ts,`C${view.id} — ${T.trials(ts.length)}`);}
  else if(view.type==='trial'){const t=TRIALS.find(x=>x.nct===view.nct);if(t)renderCards([t],`${t.nct} · ${t.sponsor}`);}
  else renderCards([],T.hint);}

function applyLang(l){lang=l;T=I18N[l];localStorage.setItem('lang',l);
  document.documentElement.lang=l;
  document.getElementById('ko').classList.toggle('on',l==='ko');
  document.getElementById('en').classList.toggle('on',l==='en');
  document.getElementById('ttl').textContent=T.title(T.cancer);
  document.getElementById('h1').textContent=T.title(T.cancer);
  document.getElementById('sub').textContent=T.sub(T.cancer);
  document.getElementById('lbl_sponsor').textContent=T.sponsor;
  document.getElementById('reset').textContent=T.reset;
  document.getElementById('cl_head').textContent=T.clusters;
  rebuildSelect();renderClusters();rerender();}

document.getElementById('ko').onclick=()=>applyLang('ko');
document.getElementById('en').onclick=()=>applyLang('en');
document.getElementById('company').addEventListener('change',e=>showCompany(e.target.value));
document.getElementById('reset').addEventListener('click',()=>{document.getElementById('company').value='__ALL__';showCompany('__ALL__');});
if(gd&&gd.on){gd.on('plotly_click',ev=>{const nct=ev.points[0].customdata?ev.points[0].customdata[0]:null;if(!nct)return;
  const t=TRIALS.find(x=>x.nct===nct);if(!t)return;view={type:'trial',nct};
  document.getElementById('company').value=t.sponsor;highlight([[t.x,t.y]]);renderCards([t],`${t.nct} · ${t.sponsor}`);
  document.getElementById('cards').scrollTop=0;});}
applyLang(lang);
</script>
